<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stepper 2.0 — Playground</title>
    <link rel="stylesheet" href="../assets/css/estil.css">
    <link rel="stylesheet" href="../assets/stepper/stepper.css">
    <script src="../assets/js/script.js"></script>
    <script src="../assets/stepper/stepper.js"></script>
    <style>
        .playground-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5em;
            margin: 2em 0;
            background: #0f172a;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-md);
            padding: 1.5em;
        }

    
        .playground-editor textarea {
            width: 100%;
            height: 380px;
            background: #030712;
            color: #f1f5f9;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px;
            padding: 1em;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            resize: vertical;
            line-height: 1.45;
        }
        .preset-btn {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0;
            padding: 0.35em 0.8em;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.15s ease;
        }
        .preset-btn:hover {
            background: var(--accent-blue);
            color: #030712;
            font-weight: 600;
        }
        .feature-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1em;
            margin: 1.5em 0;
        }
        .feature-card {
            background: #111827;
            border: 1px solid var(--border-default);
            border-radius: var(--radius-sm);
            padding: 1em 1.25em;
        }
        .feature-card h4 {
            margin: 0 0 0.4em 0;
            color: var(--accent-blue);
        }
        .feature-card p {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
<section>

    <div style="display: flex; gap: 0.5em; margin-bottom: 0.75em; flex-wrap: wrap;">
        <button type="button" class="preset-btn" onclick="loadPreset('for')">Bucle For</button>
        <button type="button" class="preset-btn" onclick="loadPreset('while')">Bucle While</button>
        <button type="button" class="preset-btn" onclick="loadPreset('ifelse')">If-Else If</button>
        <button type="button" class="preset-btn" onclick="loadPreset('switch')">Switch Enhanced</button>
        <button type="button" class="preset-btn" onclick="loadPreset('switchexpr')">Switch Expression</button>
        <button type="button" class="preset-btn" onclick="loadPreset('breaklabel')">Break amb Etiqueta</button>
        <button type="button" class="preset-btn" onclick="loadPreset('arrays')">Arrays</button>
        <button type="button" class="preset-btn" onclick="loadPreset('scanner')">Scanner</button>
        <button type="button" class="preset-btn" onclick="loadPreset('ioreadln')">IO.readln</button>
    </div>

    <div class="playground-container">
        <div class="playground-editor">
            <h3 style="margin-top:0;">Codi Font HTML del Stepper</h3>
            <textarea id="playgroundCode">&lt;div class="stepper-v2" java auto title="Bucle For Interactiu"&gt;
  &lt;code class="source"&gt;
int n = 4;
int suma = 0;

for (int i = 1; i &lt;= n; i++) {
    suma += i;
}

println("Suma total: " + suma);
  &lt;/code&gt;
&lt;/div&gt;</textarea>
            <button type="button" id="btnRenderPlayground" class="btn-next" style="margin-top: 10px; font-size: 1rem; padding: 0.6em 1.2em; background: var(--accent-blue); color: #000; font-weight: bold;">
                ⚡ Renderitzar Stepper
            </button>
        </div>
        <div class="playground-preview">
            <h3 style="margin-top:0;">Resultat Renderitzat</h3>
            <div id="playgroundMount"></div>
        </div>
    </div>

</section>

<script>
    const presets = {
        for: `<div class="stepper-v2" java auto title="Bucle For Interactiu">
  <code class="source">
int n = 4;
int suma = 0;

for (int i = 1; i <= n; i++) {
    suma += i;
}

println("Suma total: " + suma);
  </code>
</div>`,
        while: `<div class="stepper-v2" java auto title="Bucle While Interactiu">
  <code class="source">
int compta = 3;

while (compta > 0) {
    println(compta);
    compta--;
}

println("Llançament!");
  </code>
</div>`,
        ifelse: `<div class="stepper-v2" java auto title="Estructura If - Else If - Else">
  <code class="source">
int nota = 7;

if (nota >= 9) {
    println("Excel·lent");
} else if (nota >= 5) {
    println("Aprovat");
} else {
    println("Suspès");
}
  </code>
</div>`,
        switch: `<div class="stepper-v2" java auto title="Switch Modern amb Fletxes (->)">
  <code class="source">
int dia = 6;

switch (dia) {
    case 1, 2, 3, 4, 5 -> println("Dia laborable");
    case 6, 7 -> println("Cap de setmana!");
    default -> println("Dia invàlid");
}
  </code>
</div>`,
        switchexpr: `<div class="stepper-v2" java auto title="Switch Expression amb Retorn i Yield">
  <code class="source">
int dia = 2;
int punts = switch (dia) {
    case 1, 2 -> 100;
    case 3 -> 50;
    default -> {
        int bonus = 10;
        yield bonus * 2;
    }
};

println("Punts obtinguts: " + punts);
  </code>
</div>`,
        breaklabel: `<div class="stepper-v2" java auto title="Salt amb Etiqueta (Labeled Break)">
  <code class="source">
extern:
for (int i = 1; i <= 3; i++) {
    for (int j = 1; j <= 3; j++) {
        if (i == 2 && j == 2) {
            break extern;
        }
        println(i + "-" + j);
    }
}

println("Fi dels bucles!");
  </code>
</div>`,
        arrays: `<div class="stepper-v2" java auto title="Ús d'Arrays i .length">
  <code class="source">
int[] valors = {2, 4, 6};
int[] quadrats = new int[3];

for (int i = 0; i < valors.length; i++) {
    quadrats[i] = valors[i] * valors[i];
}

println("Primer quadrat: " + quadrats[0]);
println("Segon quadrat: " + quadrats[1]);
  </code>
</div>`,
        scanner: `<div class="stepper-v2" java auto in="3, 7" title="Bucle amb Scanner">
  <code class="source">
int ini = scanner.nextInt();
int fin = scanner.nextInt();
int sum = 0;

for (int i = ini; i <= fin; i++) {
    sum += i;
}

println(sum);
  </code>
</div>`,
        ioreadln: `<div class="stepper-v2" java auto in="Maria\n25" title="Entrada amb IO.readln()">
  <code class="source">
void main() {
    String nom = IO.readln("Com et dius? ");
    int edat = Integer.parseInt(IO.readln("Quina edat tens? "));
    println("Hola, " + nom + "! L'any que ve tindràs " + (edat + 1) + " anys.");
}
  </code>
</div>`
    };

    function loadPreset(key) {
        if (presets[key]) {
            document.getElementById('playgroundCode').value = presets[key];
            document.getElementById('btnRenderPlayground').click();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const txt = document.getElementById('playgroundCode');
        const mount = document.getElementById('playgroundMount');
        const btn = document.getElementById('btnRenderPlayground');

        function renderPlayground() {
            mount.innerHTML = txt.value;
            const created = mount.querySelector('.stepper-v2, stepper-v2');
            if (created) {
                const initFn = window.setupStepper || (typeof setupStepper !== 'undefined' ? setupStepper : null);
                if (initFn) {
                    initFn(created);
                }
            }
        }

        btn.addEventListener('click', renderPlayground);
        renderPlayground();
    });
</script>
</body>
</html>
